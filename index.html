<!-- =========================
     CONTACT
========================= -->

<section id="contact">

  <div class="section-label">
    Get In Touch
  </div>

  <h2 class="section-title">
    Let's Connect
  </h2>

  <div class="contact-container">

    <p
      style="
        color:#666666;
        margin-bottom:25px;
        font-size:16px;
      ">

      Interested in data science, analytics, AI/ML, or
      risk analytics? I'd love to connect.

    </p>

    <form
      class="contact-form"
      action="https://formspree.io/f/mgawrzqg"
      method="POST">

      <!-- NAME -->

      <div class="form-group">

        <label for="name">
          Name
        </label>

        <input
          type="text"
          id="name"
          name="name"
          placeholder="Your name"
          required>

      </div>


      <!-- EMAIL -->

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="your@email.com"
          required>

      </div>


      <!-- MESSAGE -->

      <div class="form-group">

        <label for="message">
          Message
        </label>

        <textarea
          id="message"
          name="message"
          placeholder="Write your message..."
          required></textarea>

      </div>


      <!-- SUBMIT -->

      <button
        type="submit"
        class="contact-submit">

        Send Message

      </button>

    </form>

  </div>

</section>
